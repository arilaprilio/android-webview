name: Build Android APK

# Trigger kapan workflow jalan:
#   - setiap push ke main (quick CI feedback)
#   - setiap pull request (verifikasi sebelum merge)
#   - setiap tag v* (publish release APK ke tab Releases)
#   - manual via tombol "Run workflow" di tab Actions
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # dibutuhkan untuk create release & upload asset

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runner ubuntu-latest sudah punya Android SDK + Gradle, tapi kita set JDK
      # eksplisit biar reproducible dan tidak ikut-ikutan versi default yang bisa
      # berubah seiring GitHub update image-nya.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Enables Gradle caching via setup-java's built-in Gradle integration.
          cache: gradle

      # Pastikan platform & build-tools yang kita pakai benar-benar ada.
      # (ubuntu-latest sudah include android-34, tapi menegaskan agar aman kalau
      # suatu saat kita naikkan compileSdk.)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Project ini belum punya gradle-wrapper.jar di-commit (biar repo bersih).
      # Jalankan `gradle wrapper` sekali supaya `./gradlew` tersedia untuk step berikutnya.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (unsigned)
        run: ./gradlew --no-daemon assembleRelease

      # Upload APK sebagai artifact — bisa di-download dari tab Actions summary.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Hanya untuk tag v* — publish APK ke tab Releases.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
